<svg xmlns="http://www.w3.org/2000/svg" width="840" height="264" viewBox="0 0 840 264" role="img" aria-label="Eleven upstream contributions merged into production ML infrastructure in 2026">
<title>Eleven upstream contributions merged into production ML infrastructure in 2026</title>
<style>
  .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace }
  .prompt { fill: #6e7681; font-size: 15px }
  .repo { fill: #58a6ff; font-size: 18px; font-weight: 600 }
  .tag { fill: #6e7681; font-size: 16px }
  .head { fill: #e6edf3; font-size: 26px; font-weight: 700 }
  .meta { fill: #8b949e; font-size: 15px }
  .slide { opacity: 0; animation: cyc 28.6s linear infinite }
  .tick { fill: #21262d }
  .tick-on { fill: #58a6ff; opacity: 0; animation: cyc 28.6s linear infinite }
  .cursor { fill: #3fb950; animation: blink 1.1s steps(1) infinite }
  @keyframes cyc {
    0%          { opacity: 0; transform: translateY(7px) }
    0.3636%  { opacity: 1; transform: translateY(0) }
    8.7273% { opacity: 1; transform: translateY(0) }
    9.0909%  { opacity: 0; transform: translateY(-7px) }
    100%        { opacity: 0; transform: translateY(-7px) }
  }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
</style>
<rect width="840" height="264" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="839" height="263" rx="9.5" fill="none" stroke="#30363d"/>
