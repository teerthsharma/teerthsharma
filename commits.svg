  <text class="m head" x="26" y="146">1.513x faster GPU island discovery</text>
  <text class="m meta" x="26" y="180">Python, Warp - 2,048 worlds, 247,308 rows, 99% CI [1.406x, 1.584x]</text>
</g>
<g class="slide" style="animation-delay:-5.200s">
  <circle cx="26" cy="86" r="6" fill="#f34b7d"/>
