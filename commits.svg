  <text class="m head" x="26" y="146">Reproducible collective-op ordering</text>
  <text class="m meta" x="26" y="180">C++ - exact bit-matrix closure, graph is a function of the model alone</text>
</g>
<g class="slide" style="animation-delay:-13.000s">
  <circle cx="26" cy="86" r="6" fill="#555555"/>
  <text class="m repo" x="42" y="92">google/XNNPACK<tspan class="tag" dx="10">#10801</tspan></text>
  <text class="m head" x="26" y="146">32 MiB lower inference workspace</text>
  <text class="m meta" x="26" y="180">C - planner reuses the arena gap, 6.4% off MobileNet V1 peak</text>
</g>
<g class="slide" style="animation-delay:-15.600s">
  <circle cx="26" cy="86" r="6" fill="#f34b7d"/>
  <text class="m repo" x="42" y="92">google/highway<tspan class="tag" dx="10">#3244</tspan></text>
  <text class="m head" x="26" y="146">65x cheaper perfect-hash builds</text>
  <text class="m meta" x="26" y="180">C++ SIMD - 894M pairwise compares down to 13.6M, same duplicates</text>
</g>
<g class="slide" style="animation-delay:-18.200s">
  <circle cx="26" cy="86" r="6" fill="#89e051"/>
  <text class="m repo" x="42" y="92">triton-lang/kernels<tspan class="tag" dx="10">#22</tspan></text>
  <text class="m head" x="26" y="146">3.48x faster long-context attention</text>
  <text class="m meta" x="26" y="180">Triton - skips 81% of blocks at 4K, within 1e-3 of the dense result</text>
</g>
<g class="slide" style="animation-delay:-20.800s">
  <circle cx="26" cy="86" r="6" fill="#dea584"/>
