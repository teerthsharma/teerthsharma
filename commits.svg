  <text class="m head" x="26" y="146">1,281x less constraint-solver memory</text>
  <text class="m meta" x="26" y="180">C/C++ - dense adjacency and flood fill replaced by a disjoint-set forest</text>
</g>
<g class="slide" style="animation-delay:-2.600s">
  <circle cx="26" cy="86" r="6" fill="#3572A5"/>
