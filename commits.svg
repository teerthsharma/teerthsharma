  <text class="m head" x="26" y="146">Deterministic GPU reduction grouping</text>
  <text class="m meta" x="26" y="180">C++ - insertion-ordered set kills hash-order drift, landed as 3d5df1d</text>
</g>
<g class="slide" style="animation-delay:-10.400s">
  <circle cx="26" cy="86" r="6" fill="#f34b7d"/>
