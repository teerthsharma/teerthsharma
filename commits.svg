<svg xmlns="http://www.w3.org/2000/svg" width="840" height="188" viewBox="0 0 840 188" role="img" aria-label="Eleven upstream contributions merged into production ML infrastructure in 2026">
<title>Eleven upstream contributions merged into production ML infrastructure in 2026</title>
<style>
  .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .prompt { fill: #6e7681; font-size: 12.5px }
  .repo { fill: #58a6ff; font-size: 14px; font-weight: 600 }
  .pr { fill: #6e7681; font-size: 13px }
  .head { fill: #e6edf3; font-size: 19px; font-weight: 700 }
  .meta { fill: #8b949e; font-size: 12px }
  .slide { opacity: 0; animation: cyc 28.6s linear infinite }
  .tick { fill: #21262d }
  .tick-on { fill: #58a6ff; opacity: 0; animation: cyc 28.6s linear infinite }
  .cursor { fill: #3fb950; animation: blink 1.1s steps(1) infinite }
  @keyframes cyc {
    0%      { opacity: 0; transform: translateY(6px) }
    0.9091% { opacity: 1; transform: translateY(0) }
    8.1818% { opacity: 1; transform: translateY(0) }
    9.0909% { opacity: 0; transform: translateY(-6px) }
    100%    { opacity: 0; transform: translateY(-6px) }
  }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
</style>
<rect width="840" height="188" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="839" height="187" rx="9.5" fill="none" stroke="#30363d"/>
<circle cx="22" cy="21" r="5" fill="#ff5f57"/><circle cx="40" cy="21" r="5" fill="#febc2e"/><circle cx="58" cy="21" r="5" fill="#28c840"/>
<text class="m prompt" x="80" y="25">upstream $ git log --author=teerthsharma --merged --year=2026</text>
<line x1="16" y1="40" x2="824" y2="40" stroke="#21262d"/>
<g class="slide" style="animation-delay:-0.000s;opacity:1">
  <circle cx="26" cy="66" r="5" fill="#f34b7d"/>
  <text class="m repo" x="40" y="71">google-deepmind/mujoco<tspan class="pr" dx="8">#3396</tspan></text>
  <text class="m head" x="26" y="108">1,281x less constraint-solver memory</text>
  <text class="m meta" x="26" y="134">C/C++ - dense adjacency + flood fill replaced by a disjoint-set forest, now public API</text>
</g>
<g class="slide" style="animation-delay:-2.600s;">
  <circle cx="26" cy="66" r="5" fill="#3572A5"/>
  <text class="m repo" x="40" y="71">google-deepmind/mujoco_warp<tspan class="pr" dx="8">#1541</tspan></text>
  <text class="m head" x="26" y="108">1.513x faster GPU island discovery, linear memory</text>
  <text class="m meta" x="26" y="134">Python / NVIDIA Warp - 2,048 worlds, 247,308 rows, 99% CI [1.406x, 1.584x]</text>
</g>
<g class="slide" style="animation-delay:-5.200s;">
  <circle cx="26" cy="66" r="5" fill="#f34b7d"/>
  <text class="m repo" x="40" y="71">google-deepmind/mujoco<tspan class="pr" dx="8">#3450</tspan></text>
  <text class="m head" x="26" y="108">3V/8 fewer probes in convex-hull construction</text>
  <text class="m meta" x="26" y="134">C++ - second quadratic scan removed, every mesh checksum byte-identical</text>
</g>
<g class="slide" style="animation-delay:-7.800s;">
  <circle cx="26" cy="66" r="5" fill="#f34b7d"/>
  <text class="m repo" x="40" y="71">openxla/xla<tspan class="pr" dx="8">#46539</tspan></text>
  <text class="m head" x="26" y="108">Deterministic GPU reduction grouping</text>
  <text class="m meta" x="26" y="134">C++ - insertion-ordered set kills hash-order nondeterminism, landed as 3d5df1d</text>
</g>
<g class="slide" style="animation-delay:-10.400s;">
  <circle cx="26" cy="66" r="5" fill="#f34b7d"/>
  <text class="m repo" x="40" y="71">tensorflow/tensorflow<tspan class="pr" dx="8">#124410</tspan></text>
  <text class="m head" x="26" y="108">Reproducible collective-op ordering</text>
  <text class="m meta" x="26" y="134">C++ - exact bit-matrix transitive closure, emitted graph is a function of the model</text>
</g>
<g class="slide" style="animation-delay:-13.000s;">
  <circle cx="26" cy="66" r="5" fill="#555555"/>
  <text class="m repo" x="40" y="71">google/XNNPACK<tspan class="pr" dx="8">#10801</tspan></text>
  <text class="m head" x="26" y="108">32 MiB lower inference workspace</text>
  <text class="m meta" x="26" y="134">C - planner reuses the arena gap, 6.4% off MobileNet V1 peak, outputs identical</text>
</g>
<g class="slide" style="animation-delay:-15.600s;">
  <circle cx="26" cy="66" r="5" fill="#f34b7d"/>
  <text class="m repo" x="40" y="71">google/highway<tspan class="pr" dx="8">#3244</tspan></text>
  <text class="m head" x="26" y="108">65x cheaper perfect-hash builds</text>
  <text class="m meta" x="26" y="134">C++ SIMD - 894M pairwise compares down to 13.6M, same duplicates found</text>
</g>
<g class="slide" style="animation-delay:-18.200s;">
  <circle cx="26" cy="66" r="5" fill="#89e051"/>
  <text class="m repo" x="40" y="71">triton-lang/kernels<tspan class="pr" dx="8">#22</tspan></text>
  <text class="m head" x="26" y="108">3.48x faster long-context attention</text>
  <text class="m meta" x="26" y="134">Triton - skips 81% of blocks at 4K context, within 1e-3 of the dense result</text>
</g>
<g class="slide" style="animation-delay:-20.800s;">
  <circle cx="26" cy="66" r="5" fill="#dea584"/>
  <text class="m repo" x="40" y="71">NVIDIA/NeMo-Relay<tspan class="pr" dx="8">#481</tspan></text>
  <text class="m head" x="26" y="108">Prompt-cache agreement 0.48 to 1.00</text>
  <text class="m meta" x="26" y="134">Rust - governor re-keyed on the stable scaffold instead of the first user message</text>
</g>
<g class="slide" style="animation-delay:-23.400s;">
  <circle cx="26" cy="66" r="5" fill="#0f1689"/>
  <text class="m repo" x="40" y="71">NVIDIA/topograph<tspan class="pr" dx="8">#432</tspan></text>
  <text class="m head" x="26" y="108">Least-privilege RBAC, ClusterRole dropped</text>
  <text class="m meta" x="26" y="134">Helm / Kubernetes - every rule gated on engine and provider, 141/141 chart tests</text>
</g>
<g class="slide" style="animation-delay:-26.000s;">
  <circle cx="26" cy="66" r="5" fill="#dea584"/>
  <text class="m repo" x="40" y="71">facebook/pyrefly<tspan class="pr" dx="8">#4180</tspan></text>
  <text class="m head" x="26" y="108">Type-checker crash pinned to 208 components</text>
  <text class="m meta" x="26" y="134">Rust - reproducer for a panic past the recheck budget, shipped in 1.2.0 via 3e90baa</text>
</g>
