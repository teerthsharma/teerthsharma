  <text class="m head" x="26" y="146">Prompt-cache agreement 0.48 to 1.00</text>
  <text class="m meta" x="26" y="180">Rust - governor re-keyed on the scaffold, not the first user message</text>
</g>
<g class="slide" style="animation-delay:-23.400s">
  <circle cx="26" cy="86" r="6" fill="#0f1689"/>
  <text class="m repo" x="42" y="92">NVIDIA/topograph<tspan class="tag" dx="10">#432</tspan></text>
  <text class="m head" x="26" y="146">Least-privilege RBAC, ClusterRole gone</text>
  <text class="m meta" x="26" y="180">Helm, Kubernetes - rules gated on engine and provider, 141/141 tests</text>
</g>
<g class="slide" style="animation-delay:-26.000s">
