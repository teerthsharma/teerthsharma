  <text class="m head" x="26" y="146">3V/8 fewer convex-hull probes</text>
  <text class="m meta" x="26" y="180">C++ - second quadratic scan removed, mesh checksums byte-identical</text>
</g>
<g class="slide" style="animation-delay:-7.800s">
  <circle cx="26" cy="86" r="6" fill="#f34b7d"/>
