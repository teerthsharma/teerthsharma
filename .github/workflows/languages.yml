name: languages

# Keeps languages.svg live. The public github-readme-stats instance was
# returning 503 on every request, so the card is rendered here instead.

on:
  schedule:
    - cron: "0 5 * * 1"      # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python langs.py teerthsharma languages.svg

      - name: Commit if it moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --quiet --cached || git commit -m "Refresh language graph"
          git push
