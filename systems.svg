<svg xmlns="http://www.w3.org/2000/svg" width="840" height="188" viewBox="0 0 840 188" role="img" aria-label="Selected systems and topology research projects">
<title>Selected systems and topology research projects</title>
<style>
  .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .prompt { fill: #6e7681; font-size: 12.5px }
  .repo { fill: #58a6ff; font-size: 14px; font-weight: 600 }
  .pr { fill: #6e7681; font-size: 13px }
  .head { fill: #e6edf3; font-size: 19px; font-weight: 700 }
  .meta { fill: #8b949e; font-size: 12px }
  .slide { opacity: 0; animation: cyc 18.2s linear infinite }
  .tick { fill: #21262d }
  .tick-on { fill: #58a6ff; opacity: 0; animation: cyc 18.2s linear infinite }
  .cursor { fill: #3fb950; animation: blink 1.1s steps(1) infinite }
  @keyframes cyc {
    0%      { opacity: 0; transform: translateY(6px) }
    1.4286% { opacity: 1; transform: translateY(0) }
    12.8571% { opacity: 1; transform: translateY(0) }
    14.2857% { opacity: 0; transform: translateY(-6px) }
    100%    { opacity: 0; transform: translateY(-6px) }
  }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
</style>
<rect width="840" height="188" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="839" height="187" rx="9.5" fill="none" stroke="#30363d"/>
<circle cx="22" cy="21" r="5" fill="#ff5f57"/><circle cx="40" cy="21" r="5" fill="#febc2e"/><circle cx="58" cy="21" r="5" fill="#28c840"/>
<text class="m prompt" x="80" y="25">lab $ ls -1 systems/ research/ --explain</text>
<line x1="16" y1="40" x2="824" y2="40" stroke="#21262d"/>
<g class="slide" style="animation-delay:-0.000s;opacity:1">
  <circle cx="26" cy="66" r="5" fill="#dea584"/>
  <text class="m repo" x="40" y="71">topological-ml-toolkit<tspan class="pr" dx="8">systems</tspan></text>
  <text class="m head" x="26" y="108">Point clouds to persistence diagrams</text>
  <text class="m meta" x="26" y="134">Rust, Python, C++/AVX-512, CUDA - four backends, one contract, checked vs ripser and GUDHI</text>
</g>
<g class="slide" style="animation-delay:-2.600s;">
  <circle cx="26" cy="66" r="5" fill="#dea584"/>
  <text class="m repo" x="40" y="71">Epsilon-Hollow<tspan class="pr" dx="8">systems</tspan></text>
  <text class="m head" x="26" y="108">Research OS: how much kernel fits in safe Rust</text>
  <text class="m meta" x="26" y="134">Rust, x86-64 asm, QEMU/UEFI, Lean 4 - UEFI boot, SMP, 4-level paging, VFS, Miri-verified</text>
</g>
<g class="slide" style="animation-delay:-5.200s;">
  <circle cx="26" cy="66" r="5" fill="#3572A5"/>
  <text class="m repo" x="40" y="71">caustic<tspan class="pr" dx="8">systems</tspan></text>
  <text class="m head" x="26" y="108">Hallucination detection without ground-truth labels</text>
  <text class="m meta" x="26" y="134">Python, PyTorch - orbit collapse to a certified error bound, 0.995 AUROC sub-0.5B, 163 tests</text>
</g>
<g class="slide" style="animation-delay:-7.800s;">
  <circle cx="26" cy="66" r="5" fill="#dea584"/>
  <text class="m repo" x="40" y="71">Aether-Lang<tspan class="pr" dx="8">research</tspan></text>
  <text class="m head" x="26" y="108">Persistent homology as a language primitive</text>
  <text class="m meta" x="26" y="134">Rust, Lean 4 - no_std binaries, 229 tests, 52 surviving mutants, six claims killed and documented</text>
</g>
<g class="slide" style="animation-delay:-10.400s;">
  <circle cx="26" cy="66" r="5" fill="#3572A5"/>
  <text class="m repo" x="40" y="71">faraday<tspan class="pr" dx="8">research</tspan></text>
  <text class="m head" x="26" y="108">3D dielectric EM solver, learned coupling operator</text>
  <text class="m meta" x="26" y="134">Python - Banach fixed point at 1.755e-16 after a 50,000-epoch burn, reproduces from checkpoint</text>
</g>
<g class="slide" style="animation-delay:-13.000s;">
  <circle cx="26" cy="66" r="5" fill="#3572A5"/>
  <text class="m repo" x="40" y="71">sigmoid<tspan class="pr" dx="8">research</tspan></text>
  <text class="m head" x="26" y="108">Trained model to world model, without retraining</text>
  <text class="m meta" x="26" y="134">Python - Hilbert-series embedding, Banach certificate when norm(T) &lt; 1, sheaf-consistency gate</text>
</g>
<g class="slide" style="animation-delay:-15.600s;">
  <circle cx="26" cy="66" r="5" fill="#8b949e"/>
  <text class="m repo" x="40" y="71">OpenCLAW-P2P v7.0<tspan class="pr" dx="8">arXiv</tspan></text>
  <text class="m head" x="26" y="108">Decentralized peer review for AI research</text>
  <text class="m meta" x="26" y="134">Co-author, arXiv:2604.19792, 2026 - resilient persistence, live verification of cited references</text>
</g>
