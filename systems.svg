<svg xmlns="http://www.w3.org/2000/svg" width="840" height="264" viewBox="0 0 840 264" role="img" aria-label="Selected systems and topology research projects">
<title>Selected systems and topology research projects</title>
<style>
  .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace }
  .prompt { fill: #6e7681; font-size: 15px }
  .repo { fill: #58a6ff; font-size: 18px; font-weight: 600 }
  .tag { fill: #6e7681; font-size: 16px }
  .head { fill: #e6edf3; font-size: 26px; font-weight: 700 }
  .meta { fill: #8b949e; font-size: 15px }
  .slide { opacity: 0; animation: cyc 18.2s linear infinite }
  .tick { fill: #21262d }
  .tick-on { fill: #58a6ff; opacity: 0; animation: cyc 18.2s linear infinite }
  .cursor { fill: #3fb950; animation: blink 1.1s steps(1) infinite }
  @keyframes cyc {
    0%          { opacity: 0; transform: translateY(7px) }
    0.5714%  { opacity: 1; transform: translateY(0) }
    13.7143% { opacity: 1; transform: translateY(0) }
    14.2857%  { opacity: 0; transform: translateY(-7px) }
    100%        { opacity: 0; transform: translateY(-7px) }
  }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
</style>
<rect width="840" height="264" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="839" height="263" rx="9.5" fill="none" stroke="#30363d"/>
<circle cx="22" cy="24" r="5" fill="#ff5f57"/><circle cx="40" cy="24" r="5" fill="#febc2e"/><circle cx="58" cy="24" r="5" fill="#28c840"/>
<text class="m prompt" x="80" y="29">lab $ ls -1 systems/ research/ --explain</text>
<line x1="16" y1="48" x2="824" y2="48" stroke="#21262d"/>
<g class="slide" style="animation-delay:0.000s;opacity:1">
  <circle cx="26" cy="86" r="6" fill="#dea584"/>
  <text class="m repo" x="42" y="92">topological-ml-toolkit<tspan class="tag" dx="10">systems</tspan></text>
  <text class="m head" x="26" y="146">Point clouds to persistence diagrams</text>
  <text class="m meta" x="26" y="180">Rust, Python, C++/AVX-512, CUDA - checked against ripser and GUDHI</text>
</g>
<g class="slide" style="animation-delay:-2.600s">
  <circle cx="26" cy="86" r="6" fill="#dea584"/>
  <text class="m repo" x="42" y="92">Epsilon-Hollow<tspan class="tag" dx="10">systems</tspan></text>
  <text class="m head" x="26" y="146">How much kernel fits in safe Rust</text>
  <text class="m meta" x="26" y="180">Rust, x86-64 asm, QEMU/UEFI, Lean 4 - SMP, paging, VFS, Miri-verified</text>
</g>
<g class="slide" style="animation-delay:-5.200s">
  <circle cx="26" cy="86" r="6" fill="#3572A5"/>
  <text class="m repo" x="42" y="92">caustic<tspan class="tag" dx="10">systems</tspan></text>
  <text class="m head" x="26" y="146">Hallucination detection without labels</text>
  <text class="m meta" x="26" y="180">Python, PyTorch - orbit collapse to a certified bound, 0.995 AUROC</text>
</g>
<g class="slide" style="animation-delay:-7.800s">
  <circle cx="26" cy="86" r="6" fill="#dea584"/>
  <text class="m repo" x="42" y="92">Aether-Lang<tspan class="tag" dx="10">research</tspan></text>
  <text class="m head" x="26" y="146">Persistent homology as a primitive</text>
  <text class="m meta" x="26" y="180">Rust, Lean 4 - no_std, 229 tests, 52 surviving mutants, six claims killed</text>
</g>
<g class="slide" style="animation-delay:-10.400s">
  <circle cx="26" cy="86" r="6" fill="#3572A5"/>
  <text class="m repo" x="42" y="92">faraday<tspan class="tag" dx="10">research</tspan></text>
  <text class="m head" x="26" y="146">3D dielectric electromagnetic solver</text>
  <text class="m meta" x="26" y="180">Python - Banach fixed point at 1.755e-16 after a 50,000-epoch burn</text>
</g>
<g class="slide" style="animation-delay:-13.000s">
  <circle cx="26" cy="86" r="6" fill="#3572A5"/>
  <text class="m repo" x="42" y="92">sigmoid<tspan class="tag" dx="10">research</tspan></text>
  <text class="m head" x="26" y="146">Trained model to world model, no retraining</text>
  <text class="m meta" x="26" y="180">Python - Banach certificate when norm(T) &lt; 1, sheaf-consistency gate</text>
</g>
<g class="slide" style="animation-delay:-15.600s">
  <circle cx="26" cy="86" r="6" fill="#8b949e"/>
  <text class="m repo" x="42" y="92">OpenCLAW-P2P v7.0<tspan class="tag" dx="10">arXiv</tspan></text>
  <text class="m head" x="26" y="146">Decentralized peer review for AI research</text>
  <text class="m meta" x="26" y="180">Co-author, arXiv:2604.19792 - resilient persistence, live verification</text>
</g>
